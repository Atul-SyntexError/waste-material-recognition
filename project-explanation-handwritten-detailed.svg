<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2100" viewBox="0 0 1400 2100">
  <rect width="1400" height="2100" fill="#fffdf7"/>
  <g stroke="#e7dfca" stroke-width="2">
    <path d="M55 125 H1345 M55 185 H1345 M55 245 H1345 M55 305 H1345 M55 365 H1345 M55 425 H1345 M55 485 H1345 M55 545 H1345 M55 605 H1345 M55 665 H1345 M55 725 H1345 M55 785 H1345 M55 845 H1345 M55 905 H1345 M55 965 H1345 M55 1025 H1345 M55 1085 H1345 M55 1145 H1345 M55 1205 H1345 M55 1265 H1345 M55 1325 H1345 M55 1385 H1345 M55 1445 H1345 M55 1505 H1345 M55 1565 H1345 M55 1625 H1345 M55 1685 H1345 M55 1745 H1345 M55 1805 H1345 M55 1865 H1345 M55 1925 H1345 M55 1985 H1345"/>
  </g>
  <g fill="#243b53" font-family="Segoe Print, Comic Sans MS, cursive">
    <text x="700" y="75" text-anchor="middle" font-size="50" font-weight="bold">Waste Material Recognition</text>
    <text x="700" y="112" text-anchor="middle" font-size="25" fill="#687b8f">Detailed project explanation • Prepared by Prince Atul</text>
  </g>
  <g stroke="#2f6690" stroke-width="4" fill="#f7fbff">
    <rect x="75" y="145" width="1250" height="235" rx="20" transform="rotate(-.5 700 260)"/>
  </g>
  <g fill="#243b53" font-family="Segoe Print, Comic Sans MS, cursive">
    <text x="110" y="205" font-size="33" font-weight="bold">1. Project objective</text>
    <text x="110" y="250" font-size="26">Build an image-classification system that recognizes the material</text>
    <text x="110" y="288" font-size="26">shown in one waste photograph. This can support faster and more</text>
    <text x="110" y="326" font-size="26">consistent waste sorting, although it is not a replacement for safety checks.</text>
    <text x="110" y="363" font-size="25" fill="#c05640">Input: one image  →  Output: class name + confidence score</text>
  </g>
  <g stroke="#5c8d68" stroke-width="4" fill="#f7fff7">
    <rect x="75" y="405" width="610" height="370" rx="20" transform="rotate(.5 380 590)"/>
  </g>
  <g fill="#243b53" font-family="Segoe Print, Comic Sans MS, cursive">
    <text x="110" y="465" font-size="33" font-weight="bold">2. Dataset</text>
    <text x="110" y="510" font-size="25">TrashNet image categories:</text>
    <text x="135" y="555" font-size="27" fill="#c05640">1. cardboard</text>
    <text x="380" y="555" font-size="27" fill="#c05640">2. glass</text>
    <text x="135" y="600" font-size="27" fill="#c05640">3. metal</text>
    <text x="380" y="600" font-size="27" fill="#c05640">4. paper</text>
    <text x="135" y="645" font-size="27" fill="#c05640">5. plastic</text>
    <text x="380" y="645" font-size="27" fill="#c05640">6. trash</text>
    <text x="110" y="700" font-size="24">Images are stored in class folders.</text>
    <text x="110" y="737" font-size="24">The notebook counts images and checks balance.</text>
  </g>
  <g stroke="#d19a2a" stroke-width="4" fill="#fffdf2">
    <rect x="715" y="405" width="610" height="370" rx="20" transform="rotate(-.5 1020 590)"/>
  </g>
  <g fill="#243b53" font-family="Segoe Print, Comic Sans MS, cursive">
    <text x="750" y="465" font-size="33" font-weight="bold">3. Preprocessing</text>
    <text x="750" y="515" font-size="25">• Read image files from folders</text>
    <text x="750" y="555" font-size="25">• Resize every image to 160 × 160</text>
    <text x="750" y="595" font-size="25">• Convert to 3-channel RGB</text>
    <text x="750" y="635" font-size="25">• Scale pixel values to 0–1</text>
    <text x="750" y="675" font-size="25">• Make train / validation / test splits</text>
    <text x="750" y="725" font-size="24" fill="#c05640">Goal: give every model the same input.</text>
  </g>
  <path d="M700 790 V835" stroke="#e07a5f" stroke-width="6"/>
  <path d="M682 817 L700 845 L718 817" fill="none" stroke="#e07a5f" stroke-width="6"/>
  <g stroke="#8b5e83" stroke-width="4" fill="#fff9ff">
    <rect x="75" y="865" width="1250" height="430" rx="20" transform="rotate(.35 700 1080)"/>
  </g>
  <g fill="#243b53" font-family="Segoe Print, Comic Sans MS, cursive">
    <text x="110" y="930" font-size="33" font-weight="bold">4. Model training and comparison</text>
    <text x="110" y="980" font-size="26">Three approaches are trained and compared:</text>
    <text x="135" y="1030" font-size="27" fill="#2f6690">A. Baseline CNN</text>
    <text x="530" y="1030" font-size="25">A simple convolutional starting point.</text>
    <text x="135" y="1085" font-size="27" fill="#2f6690">B. Improved CNN</text>
    <text x="530" y="1085" font-size="25">A stronger architecture for better features.</text>
    <text x="135" y="1140" font-size="27" fill="#2f6690">C. MobileNetV2</text>
    <text x="530" y="1140" font-size="25">Transfer learning from ImageNet.</text>
    <text x="110" y="1200" font-size="25">Training uses early stopping and best-validation checkpoints.</text>
    <text x="110" y="1240" font-size="25">The model with the best validation accuracy is selected.</text>
  </g>
  <g stroke="#2f6690" stroke-width="4" fill="#f7fbff">
    <rect x="75" y="1330" width="1250" height="305" rx="20" transform="rotate(-.4 700 1480)"/>
  </g>
  <g fill="#243b53" font-family="Segoe Print, Comic Sans MS, cursive">
    <text x="110" y="1390" font-size="33" font-weight="bold">5. Evaluation</text>
    <text x="110" y="1440" font-size="26">The notebook reviews model quality using:</text>
    <text x="145" y="1490" font-size="26">• accuracy and loss curves</text>
    <text x="500" y="1490" font-size="26">• test accuracy</text>
    <text x="145" y="1540" font-size="26">• confusion matrix</text>
    <text x="500" y="1540" font-size="26">• classification report</text>
    <text x="110" y="1590" font-size="25" fill="#c05640">These show where the classifier succeeds or confuses classes.</text>
  </g>
  <path d="M700 1650 V1695" stroke="#e07a5f" stroke-width="6"/>
  <path d="M682 1677 L700 1705 L718 1677" fill="none" stroke="#e07a5f" stroke-width="6"/>
  <g stroke="#5c8d68" stroke-width="4" fill="#f7fff7">
    <rect x="75" y="1725" width="1250" height="270" rx="20" transform="rotate(.4 700 1860)"/>
  </g>
  <g fill="#243b53" font-family="Segoe Print, Comic Sans MS, cursive">
    <text x="110" y="1785" font-size="33" font-weight="bold">6. Prediction workflow</text>
    <text x="110" y="1835" font-size="25">Saved model + class mapping + new photo</text>
    <text x="110" y="1885" font-size="30" fill="#c05640">image → resize → model.predict() → class + confidence</text>
    <text x="110" y="1935" font-size="27" fill="#2f6690">Example:  Predicted class: plastic   |   Confidence: 87.42%</text>
  </g>
  <g fill="#243b53" font-family="Segoe Print, Comic Sans MS, cursive">
    <text x="75" y="2050" font-size="22">Main files: notebook (training) • predict.py (inference) • models/ (saved models) • data/ (dataset) • requirements.txt</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <rect width="1200" height="1600" fill="#fffdf5"/>
  <path d="M85 90 C260 70 420 105 590 86 S930 72 1115 92" fill="none" stroke="#d9d2bd" stroke-width="3"/>
  <path d="M85 1510 C280 1490 420 1520 610 1505 S950 1490 1115 1512" fill="none" stroke="#d9d2bd" stroke-width="3"/>
  <g fill="#243b53" font-family="Segoe Print, Comic Sans MS, cursive">
    <text x="600" y="125" text-anchor="middle" font-size="52" font-weight="bold">Waste Material Recognition</text>
    <text x="600" y="175" text-anchor="middle" font-size="27" fill="#61758a">A simple AI project by Prince Atul</text>
  </g>
  <g stroke="#2f6690" stroke-width="4" fill="#f8fbff">
    <rect x="90" y="230" width="1020" height="195" rx="22" transform="rotate(-1 600 327)"/>
  </g>
  <g fill="#243b53" font-family="Segoe Print, Comic Sans MS, cursive">
    <text x="125" y="285" font-size="34" font-weight="bold">1. Problem</text>
    <text x="125" y="335" font-size="27">Waste is difficult to sort manually.</text>
    <text x="125" y="375" font-size="27">Can a computer look at one image</text>
    <text x="125" y="412" font-size="27">and identify its material type?</text>
  </g>
  <path d="M600 435 L600 485" stroke="#e07a5f" stroke-width="6"/>
  <path d="M585 468 L600 492 L615 468" fill="none" stroke="#e07a5f" stroke-width="6"/>
  <g stroke="#5c8d68" stroke-width="4" fill="#f7fff7">
    <rect x="90" y="500" width="1020" height="285" rx="22" transform="rotate(1 600 640)"/>
  </g>
  <g fill="#243b53" font-family="Segoe Print, Comic Sans MS, cursive">
    <text x="125" y="560" font-size="34" font-weight="bold">2. Dataset</text>
    <text x="125" y="608" font-size="27">TrashNet images are divided into 6 classes:</text>
    <text x="155" y="660" font-size="29" fill="#c05640">● cardboard</text>
    <text x="390" y="660" font-size="29" fill="#c05640">● glass</text>
    <text x="570" y="660" font-size="29" fill="#c05640">● metal</text>
    <text x="155" y="710" font-size="29" fill="#c05640">● paper</text>
    <text x="390" y="710" font-size="29" fill="#c05640">● plastic</text>
    <text x="620" y="710" font-size="29" fill="#c05640">● trash</text>
    <text x="125" y="758" font-size="25">Images are resized to 160 × 160 pixels.</text>
  </g>
  <path d="M600 800 L600 850" stroke="#e07a5f" stroke-width="6"/>
  <path d="M585 833 L600 857 L615 833" fill="none" stroke="#e07a5f" stroke-width="6"/>
  <g stroke="#8b5e83" stroke-width="4" fill="#fff9ff">
    <rect x="90" y="865" width="1020" height="300" rx="22" transform="rotate(-.8 600 1015)"/>
  </g>
  <g fill="#243b53" font-family="Segoe Print, Comic Sans MS, cursive">
    <text x="125" y="925" font-size="34" font-weight="bold">3. Machine Learning Pipeline</text>
    <text x="145" y="980" font-size="28">image → preprocessing → training → prediction</text>
    <text x="125" y="1035" font-size="27">• Split images into train, validation and test sets</text>
    <text x="125" y="1078" font-size="27">• Compare a baseline CNN, improved CNN</text>
    <text x="125" y="1120" font-size="27">  and MobileNetV2 transfer learning</text>
  </g>
  <path d="M600 1180 L600 1230" stroke="#e07a5f" stroke-width="6"/>
  <path d="M585 1213 L600 1237 L615 1213" fill="none" stroke="#e07a5f" stroke-width="6"/>
  <g stroke="#d19a2a" stroke-width="4" fill="#fffdf2">
    <rect x="90" y="1245" width="1020" height="210" rx="22" transform="rotate(.7 600 1350)"/>
  </g>
  <g fill="#243b53" font-family="Segoe Print, Comic Sans MS, cursive">
    <text x="125" y="1305" font-size="34" font-weight="bold">4. Result</text>
    <text x="125" y="1355" font-size="27">The selected model predicts the class and confidence.</text>
    <text x="125" y="1405" font-size="29" fill="#2f6690">Predicted class: plastic</text>
    <text x="650" y="1405" font-size="29" fill="#2f6690">Confidence: 87.42%</text>
  </g>
  <g fill="#61758a" font-family="Segoe Print, Comic Sans MS, cursive" font-size="23">
    <text x="600" y="1535" text-anchor="middle">Python • TensorFlow • Keras • NumPy • OpenCV-style image preprocessing</text>
  </g>
  <g fill="none" stroke="#243b53" stroke-width="3">
    <path d="M75 210 Q55 300 75 450"/>
    <path d="M1125 210 Q1145 300 1125 450"/>
    <path d="M75 1215 Q55 1310 75 1470"/>
    <path d="M1125 1215 Q1145 1310 1125 1470"/>
  </g>
</svg>
